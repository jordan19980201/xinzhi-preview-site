<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>html { touch-action: pan-x pan-y; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }</style>
<script>/* 手機不能雙指放大：iOS Safari 不理 user-scalable=no，要另外擋住縮放手勢 */
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false }); });
document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });</script>
<title>信誌科技 新版 | 手機版預覽</title>
<style>
  /* 只用來在電腦上用手機尺寸（390×844）看預覽，不是網站的一部分 */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e8e8ed; font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .phone { padding: 14px; border-radius: 60px; background: #1d1d1f; box-shadow: inset 0 0 0 2px #3a3a3c, 0 40px 80px -30px rgba(0,0,0,.5); }
  iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 46px; background: #fff; }
  p { margin: 14px 0 0; text-align: center; font-size: 13px; color: #6e6e73; }
</style>
</head>
<body>
  <div>
    <div class="phone"><iframe src="./" title="信誌科技官網 手機版"></iframe></div>
    <p>手機版預覽（390 × 844）· 在框內捲動</p>
  </div>
</body>
</html>
